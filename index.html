<!DOCTYPE html>
<html>
<head>
    <title>NBA Playoff Oracle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <h1>NBA Playoff Oracle</h1>
    </div>
    
    <div class="container">
        <!-- Summary Stats Section -->
        <div id="summary-stats" class="summary-grid"></div>
        
        <!-- Search and Filter Section -->
        <div class="search-container">
            <input type="text" id="team-search" placeholder="Search teams...">
        </div>
        
        <div class="filter-buttons">
            <button class="filter-button" data-filter="all">All Teams</button>
            <button class="filter-button" data-filter="locks">Locks (90%+)</button>
            <button class="filter-button" data-filter="bubble">Bubble (40-60%)</button>
            <button class="filter-button" data-filter="longshots">Long Shots</button>
        </div>
        
        <!-- Teams Container -->
        <h2>2024 Playoff Probabilities</h2>
        <div id="teams-container" class="teams-grid">
            <!-- JavaScript will populate this -->
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <p>Last updated: <span id="last-updated">Loading...</span></p>
            <button id="refresh-button" class="refresh-button">🔄 Refresh</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
