<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA · playoff oracle</title>
    <link rel="stylesheet" href="nba_style.css">
</head>
<body>

<header class="nba-black-header">
    <div class="black-header-inner">
        <div class="left-menu">
            <a href="#">NBA</a>
            <a href="#">ALL-STAR</a>
            <a href="#">SCHEDULE</a>
            <a href="#">WATCH</a>
            <a href="#">NEWS</a>
            <a href="#">STATS</a>
            <a href="#">STANDINGS</a>
            <a href="#" class="active-page">PLAYOFFPROBABILITY</a>  
            <a href="#">TEAMS</a>
            <a href="#">PLAYERS</a>
            <a href="#">FANTASY</a>
        </div>
        <div class="right-user">
            <a href="#">SEARCH</a>
            <a href="#">ACCOUNT</a>
            <a href="#" class="sign-in">SIGN IN</a>
        </div>
    </div>

    <div class="oracle-subheader">
        <div class="oracle-subheader-inner">
            <div class="oracle-title-area">
                <span class="nba-mini">NBA</span>
                <span class="oracle-word">ORACLE</span>
                <span class="azure-badge">by 4Sisters&NoWedding</span>
            </div>
        </div>
    </div>
</header>

<main class="main-container">

    <div class="headline-row">
        <h1>2026 NBA Playoff Probabilities</h1>
        <div class="pill-azure">2026 NBA Playoff Probabilities</div>
    </div>

    <div class="conf-tabs">
        <button class="conf-tab active-conf" id="tabAll">ALL TEAMS</button>
        <button class="conf-tab" id="tabEast">EASTERN CONFERENCE</button>
        <button class="conf-tab" id="tabWest">WESTERN CONFERENCE</button>
    </div>

    <!-- Table structure optimized for your dataset -->
    <table class="stats-table">
        <thead>
            <tr>
                <th>RANK</th>
                <th>TEAM</th>
                <th>RECORD</th>
                <th>DEF RATING</th>
                <th>3P%</th>
                <th>PLAYOFF %</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- predictions.json -->
        </tbody>
    </table>

    <div class="security-note">
        Group Name: 4Sisters&NoWedding - CLDCOMP FINALS
    </div>
</main>

<script src="app.js"></script>
</body>
</html>
